<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>บัญชีของฉัน - Cinema</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="cinema-api.js"></script>
<script src="site-ui.js"></script>
  <script src="movies-data.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#e9508c",
            "background-light": "#f8f6f7",
            "background-dark": "#211117",
          },
          fontFamily: {
            display: ["Inter", "Noto Sans Thai", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet"/>
<link href="site.css" rel="stylesheet"/>
</head>
<body class="flex flex-col bg-background-light text-slate-900 min-h-screen font-display">
<header id="site-header"></header>
<script>cinemaUi.header({"active": "account"});</script>

  <main class="ui-page space-y-6 flex-grow">
    <section class="profile-hero">
      <div class="flex flex-col sm:flex-row sm:items-center gap-5">
        <div class="profile-avatar" id="user-avatar">U</div>
        <div class="min-w-0 flex-1">
          <p class="ui-eyebrow">บัญชีของฉัน</p>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight truncate" id="profile-name">ผู้ใช้</h1>
          <p class="mt-1 truncate" style="color:var(--muted)" id="profile-email">email@example.com</p>
        </div>
        <div class="flex flex-wrap gap-2 sm:justify-end">
          <button class="ui-btn ui-btn-ghost !h-11" id="logout-btn-user"><span class="material-symbols-outlined">logout</span>ออกจากระบบ</button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-6">
        <div class="profile-stat"><span class="material-symbols-outlined">stars</span><div><small>คะแนนสะสม</small><b><span id="profile-points">0</span> <em>แต้ม</em></b></div></div>
        <div class="profile-stat"><span class="material-symbols-outlined">workspace_premium</span><div><small>ระดับสมาชิก</small><b id="profile-tier">Member</b></div></div>
      </div>
    </section>

    <div class="account-tabs" role="tablist" aria-label="ข้อมูลบัญชี">
      <button type="button" role="tab" data-account-tab="tickets" aria-selected="true"><span class="material-symbols-outlined">confirmation_number</span>ตั๋วที่กำลังจะถึง</button>
      <button type="button" role="tab" data-account-tab="history" aria-selected="false"><span class="material-symbols-outlined">receipt_long</span>ประวัติการซื้อ</button>
      <button type="button" role="tab" data-account-tab="watchlist" aria-selected="false"><span class="material-symbols-outlined">favorite</span>หนังที่อยากดู</button>
    </div>

    <section data-account-panel="tickets">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" id="upcoming-list">
        <div class="ui-card empty-box col-span-full">กำลังโหลด...</div>
      </div>
    </section>

    <section data-account-panel="history" hidden>
      <div class="ui-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="account-table w-full text-left text-sm">
            <thead><tr><th>ภาพยนตร์</th><th>รอบฉาย</th><th>ที่นั่ง</th><th class="text-right">ราคา</th></tr></thead>
            <tbody id="history-table-body">
              <tr><td colspan="4">ยังไม่มีประวัติ</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section data-account-panel="watchlist" hidden>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="watchlist-grid">
        <div class="ui-card empty-box col-span-full">ยังไม่มีหนังที่บันทึกไว้</div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const tabs = document.querySelectorAll('[data-account-tab]');
      function show(name) {
        tabs.forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.accountTab === name)));
        document.querySelectorAll('[data-account-panel]').forEach((panel) => { panel.hidden = panel.dataset.accountPanel !== name; });
      }
      tabs.forEach((tab) => tab.addEventListener('click', () => { show(tab.dataset.accountTab); history.replaceState(null, '', `#${tab.dataset.accountTab}`); }));
      const initial = location.hash.slice(1);
      if (['tickets', 'history', 'watchlist'].includes(initial)) show(initial);
    })();
  </script>
<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>

  <script type="module">
    import { app, auth } from './firebase-init.js';
    import { initializeAuthUI } from './auth.js';
    initializeAuthUI(app);
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js';

    const api = window.cinemaApi;
    const esc = api.escapeHtml;

    const profileName = document.getElementById('profile-name');
    const profileEmail = document.getElementById('profile-email');
    const profilePoints = document.getElementById('profile-points');
    const profileTier = document.getElementById('profile-tier');
    const userAvatar = document.getElementById('user-avatar');
    const upcomingList = document.getElementById('upcoming-list');
    const historyTableBody = document.getElementById('history-table-body');
    const watchlistGrid = document.getElementById('watchlist-grid');
    const logoutBtn = document.getElementById('logout-btn-user');
    const WATCHLIST_KEY = 'cinema.watchlistByUid';

    function tierByPoints(points) {
      if (points >= 3000) return 'สมาชิกแพลทินัม';
      if (points >= 1200) return 'สมาชิกโกลด์';
      if (points >= 500) return 'สมาชิกซิลเวอร์';
      return 'สมาชิก';
    }

    function formatDateLabel(showtime) {
      return `${showtime?.dateLabel || '-'} ${showtime?.startTime || ''}`.trim();
    }

    function findMovieRef(booking) {
      if (!booking || typeof moviesDatabase === 'undefined') return null;
      const movieId = booking.showtime?.movieId || booking.movie?.id;
      if (movieId && moviesDatabase[movieId]) return moviesDatabase[movieId];

      const title = String(booking.movie?.title || '').trim().toLowerCase();
      return Object.values(moviesDatabase).find((movieItem) => {
        const thai = String(movieItem.titleThai || '').trim().toLowerCase();
        const eng = String(movieItem.titleEng || '').trim().toLowerCase();
        return thai === title || eng === title;
      }) || null;
    }

    function getPosterForBooking(booking) {
      const movieRef = findMovieRef(booking);
      if (movieRef) return movieRef.posterImage || movieRef.backdropImage || movieRef.trailerImage;
      return booking.movie?.poster || 'https://picsum.photos/seed/movie-ticket-fallback/500/750';
    }

    async function hydrateUpcomingPosters() {
      const posterEls = Array.from(document.querySelectorAll('#upcoming-list img[data-booking-movie-id]'));
      await Promise.all(posterEls.map(async (imgEl) => {
        const movieId = imgEl.getAttribute('data-booking-movie-id');
        if (!movieId || typeof moviesDatabase === 'undefined') return;
        const movieRef = moviesDatabase[movieId];
        if (!movieRef || !window.cinemaMovieImages?.getRealMoviePoster) return;
        const realPoster = await window.cinemaMovieImages.getRealMoviePoster(movieRef);
        if (realPoster) imgEl.src = realPoster;
      }));
    }

    async function hydrateWatchlistPosters() {
      const posterEls = Array.from(document.querySelectorAll('#watchlist-grid img[data-watchlist-movie-id]'));
      await Promise.all(posterEls.map(async (imgEl) => {
        const movieId = imgEl.getAttribute('data-watchlist-movie-id');
        if (!movieId || typeof moviesDatabase === 'undefined') return;
        const movieRef = moviesDatabase[movieId];
        if (!movieRef || !window.cinemaMovieImages?.getRealMoviePoster) return;
        const realPoster = await window.cinemaMovieImages.getRealMoviePoster(movieRef);
        if (realPoster) imgEl.src = realPoster;
      }));
    }

    function readWatchlistMap() {
      try {
        const raw = localStorage.getItem(WATCHLIST_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (_error) {
        return {};
      }
    }

    function getWatchlistForUid(uid) {
      const watchlistMap = readWatchlistMap();
      const ids = Array.isArray(watchlistMap[uid]) ? watchlistMap[uid] : [];
      if (typeof moviesDatabase === 'undefined') return [];
      return ids
        .map((id) => moviesDatabase[id])
        .filter(Boolean);
    }

    function removeFromWatchlist(uid, movieId) {
      if (!uid || !movieId) return;
      const watchlistMap = readWatchlistMap();
      const current = new Set(Array.isArray(watchlistMap[uid]) ? watchlistMap[uid] : []);
      if (!current.has(movieId)) return;
      current.delete(movieId);
      watchlistMap[uid] = Array.from(current);
      localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlistMap));
    }

    function renderWatchlist(uid) {
      if (!watchlistGrid) return;
      const items = getWatchlistForUid(uid);
      if (items.length === 0) {
        watchlistGrid.innerHTML = '<div class="ui-card empty-box col-span-full"><span class="material-symbols-outlined">favorite</span>ยังไม่มีหนังที่บันทึกไว้ กด "อยากดู" ในหน้าหนังเพื่อบันทึก</div>';
        return;
      }

      watchlistGrid.innerHTML = items.map((movie) => `
        <div class="ticket-card !p-4 !gap-3">
          <img class="w-16 h-24 rounded-lg object-cover bg-slate-100 flex-shrink-0" src="${movie.posterImage || movie.backdropImage || movie.trailerImage}" alt="${esc(movie.titleThai)}" data-watchlist-movie-id="${movie.id}" />
          <div class="min-w-0 flex-1">
            <h3 class="font-bold text-slate-900 leading-tight line-clamp-2">${esc(movie.titleThai)}</h3>
            <p class="text-xs text-slate-500 mt-1 line-clamp-1">${esc(movie.titleEng || '')}</p>
            <p class="text-xs text-slate-500 mt-1">${esc(movie.duration || '-')} • ${esc(Array.isArray(movie.genres) ? movie.genres.join(', ') : '-')}</p>
            <div class="mt-3 flex items-center gap-3">
              <a class="inline-flex text-xs font-bold text-primary hover:underline" href="movie-details.html?id=${encodeURIComponent(movie.id)}">เปิดรายละเอียด</a>
              <button class="watchlist-remove-btn inline-flex text-xs font-bold text-rose-500 hover:underline" data-remove-movie-id="${movie.id}" type="button">ลบออก</button>
            </div>
          </div>
        </div>
      `).join('');

      hydrateWatchlistPosters();

      watchlistGrid.querySelectorAll('.watchlist-remove-btn').forEach((buttonEl) => {
        buttonEl.addEventListener('click', () => {
          const movieId = buttonEl.getAttribute('data-remove-movie-id');
          removeFromWatchlist(uid, movieId);
          renderWatchlist(uid);
        });
      });
    }

    function renderBookings(bookings) {
      if (!Array.isArray(bookings) || bookings.length === 0) {
        upcomingList.innerHTML = '<div class="ui-card empty-box col-span-full"><span class="material-symbols-outlined">local_activity</span>ยังไม่มีการจอง <a class="text-primary font-bold" href="movies.html">เลือกหนังเลย</a></div>';
        historyTableBody.innerHTML = '<tr><td colspan="4" class="empty-box">ยังไม่มีประวัติการซื้อ</td></tr>';
        return;
      }

      const sorted = [...bookings].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
      const upcoming = sorted
        .filter((booking) => booking.status === 'paid' && (!booking.showtime?.date || booking.showtime.date >= today))
        .sort((a, b) => `${a.showtime?.date}${a.showtime?.startTime}`.localeCompare(`${b.showtime?.date}${b.showtime?.startTime}`));

      if (upcoming.length === 0) {
        upcomingList.innerHTML = '<div class="ui-card empty-box col-span-full"><span class="material-symbols-outlined">event_available</span>ไม่มีตั๋วที่กำลังจะถึง <a class="text-primary font-bold" href="movies.html">ดูหนังที่กำลังฉาย</a></div>';
      } else upcomingList.innerHTML = upcoming.slice(0, 4).map((booking) => `
        <div class="ticket-card">
          <img class="w-20 h-28 rounded-xl object-cover bg-slate-100 flex-shrink-0" src="${getPosterForBooking(booking)}" data-booking-movie-id="${findMovieRef(booking)?.id || ''}" alt="${booking.movie?.title || 'Movie'}" />
          <div class="min-w-0 flex-1">
            <h3 class="font-bold text-lg truncate">${esc(booking.movie?.title || '-')}</h3>
            <p class="text-sm text-slate-500 mt-1">${esc(booking.movie?.cinema || '-')} • ${esc(booking.movie?.hall || '-')}</p>
            <p class="text-sm text-slate-500">${formatDateLabel(booking.showtime)}</p>
            <p class="text-sm text-slate-600 mt-2">ที่นั่ง: ${Array.isArray(booking.seats) ? booking.seats.join(', ') : '-'}</p>
            <div class="mt-4 flex gap-2">
              <a class="ui-btn ui-btn-primary !h-10 !px-4 !text-sm" href="booking-confirmation.html?bookingId=${encodeURIComponent(booking.bookingId)}">เปิดตั๋ว</a>
              <span class="inline-flex items-center px-3 h-10 text-xs rounded-xl font-mono font-semibold" style="background:var(--surface-2);color:var(--ink-2)">${booking.bookingId}</span>
            </div>
          </div>
        </div>
      `).join('');

      hydrateUpcomingPosters();

      historyTableBody.innerHTML = sorted.map((booking) => `
        <tr>
          <td class="font-medium">
            <a class="hover:text-primary" href="${booking.status === 'pending' ? 'checkout' : 'booking-confirmation'}.html?bookingId=${encodeURIComponent(booking.bookingId)}">${esc(booking.movie?.title || '-')}</a>
            <div class="mt-1">${api.statusBadge(booking.status)}</div>
          </td>
          <td class="text-slate-600">${formatDateLabel(booking.showtime)}</td>
          <td class="text-slate-600">${Array.isArray(booking.seats) ? booking.seats.join(', ') : '-'}</td>
          <td class="font-semibold text-right whitespace-nowrap">฿${Number(booking.pricing?.total || 0).toLocaleString('th-TH')}</td>
        </tr>
      `).join('');
    }

    function showAdminLink() {
      if (document.getElementById('admin-link')) return;
      const link = document.createElement('a');
      link.id = 'admin-link';
      link.href = 'admin.html';
      link.className = 'ui-btn ui-btn-ghost !h-11';
      link.innerHTML = '<span class="material-symbols-outlined text-base">admin_panel_settings</span>ระบบหลังบ้าน';
      logoutBtn.insertAdjacentElement('beforebegin', link);
    }

    async function loadUserData(user) {
      const uid = user.uid;
      const displayName = user.displayName || localStorage.getItem('cinema.userDisplayName') || 'ผู้ใช้';
      const email = user.email || localStorage.getItem('cinema.userEmail') || 'email@example.com';

      profileName.textContent = displayName;
      profileEmail.textContent = email;
      userAvatar.textContent = (displayName || email).charAt(0).toUpperCase();

      await api.catalog();
      try {
        const userData = await api.request('/api/me');
        const points = Number(userData.loyaltyPoints || 0);
        profilePoints.textContent = points.toLocaleString('th-TH');
        profileTier.textContent = userData.role === 'admin' ? 'ผู้ดูแลระบบ' : tierByPoints(points);
        if (userData.role === 'admin') showAdminLink();
      } catch (_error) {
        profilePoints.textContent = '0';
        profileTier.textContent = 'สมาชิก';
      }

      try {
        renderBookings(await api.request('/api/me/bookings'));
      } catch (_error) {
        renderBookings([]);
      }

      renderWatchlist(uid);
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      loadUserData(user);
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (_error) {
      }
      localStorage.removeItem('cinema.uid');
      localStorage.removeItem('cinema.userEmail');
      localStorage.removeItem('cinema.userDisplayName');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
