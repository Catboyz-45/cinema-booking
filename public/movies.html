<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ภาพยนตร์ - Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="cinema-api.js"></script>
<script src="site-ui.js"></script>
  <script src="movies-data.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e9508c',
            'background-light': '#f8f6f7'
          }
        }
      }
    };
  </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet"/>
<link href="site.css" rel="stylesheet"/>
</head>
<body class="bg-background-light text-slate-900 min-h-screen flex flex-col font-[Inter]">
<header id="site-header"></header>
<script>cinemaUi.header({"active": "movies", "search": {"id": "page-search-input", "placeholder": "ค้นหาภาพยนตร์"}});</script>

  <main class="flex-grow max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8">
      <div>
        <h1 class="ui-title mb-1">ภาพยนตร์</h1>
        <p class="text-slate-600">รวมภาพยนตร์ที่กำลังฉายและรอบใหม่ล่าสุด</p>
      </div>
    </div>

    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-6">
      <button class="filter-btn px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-bold whitespace-nowrap" data-genre="all">ทั้งหมด</button>
      <button class="filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-genre="แอ็คชัน">แอ็คชัน</button>
      <button class="filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-genre="สยองขวัญ">สยองขวัญ</button>
      <button class="filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-genre="แอนิเมชัน">แอนิเมชัน</button>
      <button class="filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-genre="ดราม่า">ดราม่า</button>
      <button class="filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-genre="ไซไฟ">ไซไฟ</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="movies-grid">
      <!-- Movies will be populated here -->
    </div>
  </main>

<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>

  <script>
    (async () => {
        await window.cinemaApi.catalog();
      const moviesGrid = document.getElementById('movies-grid');
      const filterButtons = document.querySelectorAll('.filter-btn');
      const pageSearchInput = document.getElementById('page-search-input');
      const genreAlias = {
        action: 'แอ็คชัน',
        adventure: 'ผจญภัย',
        thriller: 'ระทึกขวัญ',
        comedy: 'คอมเมดี้',
        crime: 'อาชญากรรม',
        animation: 'แอนิเมชัน',
        drama: 'ดราม่า',
        fantasy: 'แฟนตาซี',
        scifi: 'ไซไฟ',
        'sci-fi': 'ไซไฟ',
        horror: 'สยองขวัญ'
      };

      function normalizeGenreLabel(genre) {
        const normalized = String(genre || '').toLowerCase().replace(/\s+/g, '').trim();
        return genreAlias[normalized] || genre;
      }

      function getPoster(movie) {
        return window.cinemaMovieImages.posterFor(movie);
      }

      async function hydrateMoviePosters() {
        const posterEls = Array.from(moviesGrid.querySelectorAll('img[data-movie-id]'));
        await Promise.all(posterEls.map(async (imgEl) => {
          const movieId = imgEl.getAttribute('data-movie-id');
          const movie = moviesDatabase[movieId];
          if (!movie || !window.cinemaMovieImages?.getRealMoviePoster) return;
          const realPoster = await window.cinemaMovieImages.getRealMoviePoster(movie);
          if (realPoster) {
            imgEl.src = realPoster;
          }
        }));
      }

      // "โปรแกรมหน้า" movies are listed on the home page, not with the films now showing
      const allMovies = Object.values(moviesDatabase).filter((movie) => movie.status !== 'coming_soon').map((movie) => ({
        ...movie,
        normalizedGenres: (movie.genres || []).map(normalizeGenreLabel)
      }));
      let activeGenre = 'all';
      let activeKeyword = '';

      function bindCardActions() {
        document.querySelectorAll('.movie-card').forEach((card) => {
          const movieId = card.getAttribute('data-movie-id');

          card.addEventListener('click', () => {
            window.location.href = `movie-details.html?id=${movieId}`;
          });

          const buyBtn = card.querySelector('.buy-ticket-btn');
          if (buyBtn) {
            buyBtn.addEventListener('click', (event) => {
              event.stopPropagation();
              window.location.href = `movie-details.html?id=${encodeURIComponent(movieId)}#showtimes-container`;
            });
          }
        });
      }

      function renderMovies(selectedGenre = 'all') {
        activeGenre = selectedGenre;
        const moviesToShow = selectedGenre === 'all'
          ? allMovies
          : allMovies.filter((movie) => movie.normalizedGenres.includes(selectedGenre));

        const keyword = activeKeyword.trim().toLowerCase();
        const filteredMovies = keyword
          ? moviesToShow.filter((movie) => {
              const bag = [movie.titleThai, movie.titleEng, ...(movie.normalizedGenres || [])].join(' ').toLowerCase();
              return bag.includes(keyword);
            })
          : moviesToShow;

        if (filteredMovies.length === 0) {
          moviesGrid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">ไม่พบหนังในหมวดนี้</div>';
          return;
        }

        moviesGrid.innerHTML = filteredMovies.map((movie) => `
          <div class="group flex flex-col gap-3 movie-card cursor-pointer" data-movie-id="${movie.id}">
            <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-slate-200 shadow-sm transition-transform duration-300 group-hover:-translate-y-1">
              <img alt="${movie.titleThai}" class="w-full h-full object-cover" data-movie-id="${movie.id}" src="${getPoster(movie)}" onerror="this.onerror=null;this.src=window.cinemaMovieImages.generatedPoster(moviesDatabase[this.dataset.movieId] || {});" />
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <button class="buy-ticket-btn bg-primary text-white px-6 py-2 rounded-full font-bold shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                  ซื้อตั๋ว
                </button>
              </div>
            </div>
            <div>
              <h3 class="font-bold text-slate-900 text-lg truncate group-hover:text-primary transition-colors">${movie.titleThai}</h3>
              <div class="flex items-center justify-between mt-1 text-sm text-slate-500">
                <span>${movie.duration}</span>
                <span class="border border-slate-300 text-xs px-1 rounded">${movie.ageLimit || 'G'}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1 truncate">${movie.normalizedGenres.join(' • ')}</p>
              <div class="mt-2 flex items-center gap-1 text-yellow-500 text-sm font-medium">
                <span class="material-symbols-outlined text-base fill-current">star</span>
                <span>${movie.rating}</span>
              </div>
            </div>
          </div>
        `).join('');

        bindCardActions();
        hydrateMoviePosters();
      }

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const selectedGenre = button.getAttribute('data-genre');
          filterButtons.forEach((btn) => {
            btn.classList.remove('bg-slate-900', 'text-white');
            btn.classList.add('bg-background-light', 'text-slate-600');
          });
          button.classList.remove('bg-background-light', 'text-slate-600');
          button.classList.add('bg-slate-900', 'text-white');
          renderMovies(selectedGenre);
        });
      });

      if (pageSearchInput) {
        let searchTimer = null;
        pageSearchInput.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            activeKeyword = pageSearchInput.value || '';
            renderMovies(activeGenre);
          }, 120);
        });
      }
      
      // ?q= from the header search on other pages
      const initialQuery = new URLSearchParams(window.location.search).get('q');
      if (initialQuery && pageSearchInput) {
        pageSearchInput.value = initialQuery;
        activeKeyword = initialQuery;
      }
      renderMovies('all');
    })();
  </script>

    

    <script type="module">
    import { app, firebaseConfig } from './firebase-init.js';
    import { initializeAuthUI } from './auth.js';

    initializeAuthUI(app, firebaseConfig);
</script>
</body>
</html>
