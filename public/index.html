<script src="movies-data.js"></script>
<script>
    (async () => {
        await window.cinemaApi.catalog();
        const movieGrid = document.getElementById('movie-grid');
        const moviePagination = document.getElementById('movie-pagination');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const searchInput = document.getElementById('home-search-input');
        const heroBannerImage = document.getElementById('hero-banner-image');
        heroBannerImage?.addEventListener('load', () => heroBannerImage.classList.replace('opacity-0', 'opacity-60'));
        const heroFormatBadge = document.getElementById('hero-format-badge');
        const heroBannerTitle = document.getElementById('hero-banner-title');
        const heroBannerDuration = document.getElementById('hero-banner-duration');
        const heroBannerGenre = document.getElementById('hero-banner-genre');
        const heroBannerAge = document.getElementById('hero-banner-age');
        const heroBannerDescription = document.getElementById('hero-banner-description');
        const heroIndicators = document.getElementById('hero-indicators');
        const genreAlias = {
            action: 'แอ็คชัน',
            adventure: 'ผจญภัย',
            thriller: 'ระทึกขวัญ',
            comedy: 'คอมเมดี้',
            crime: 'อาชญากรรม',
            animation: 'แอนิเมชัน',
            drama: 'ดราม่า',
            fantasy: 'แฟนตาซี',
            scifi: 'ไซไฟ',
            'sci-fi': 'ไซไฟ',
            horror: 'สยองขวัญ'
        };

        function normalizeGenreLabel(genre) {
            const normalized = String(genre || '').toLowerCase().replace(/\s+/g, '').trim();
            return genreAlias[normalized] || genre;
        }

        function getPoster(movie) {
            return window.cinemaMovieImages.posterFor(movie);
        }

        async function hydrateMoviePosters() {
            const posterEls = Array.from(movieGrid.querySelectorAll('img[data-movie-id]'));
            await Promise.all(posterEls.map(async (imgEl) => {
                const movieId = imgEl.getAttribute('data-movie-id');
                const movie = moviesDatabase[movieId];
                if (!movie || !window.cinemaMovieImages?.getRealMoviePoster) return;
                const realPoster = await window.cinemaMovieImages.getRealMoviePoster(movie);
                if (realPoster) {
                    imgEl.src = realPoster;
                }
            }));
        }

        const isComingSoon = (movie) => movie.status === 'coming_soon';
        const allMovies = Object.values(moviesDatabase).filter((movie) => !isComingSoon(movie)).map((movie) => ({
            ...movie,
            normalizedGenres: (movie.genres || []).map(normalizeGenreLabel)
        }));

        const featuredMovieIds = ['death-whisperer-2', 'the-marvels', 'hunger-games'];
        const featuredMovies = featuredMovieIds
            .map((id) => allMovies.find((movie) => movie.id === id))
            .filter(Boolean);
        let activeGenre = 'all';
        let activeSearchQuery = '';
        let activeHeroIndex = 0;
        let heroTimer = null;
        let heroImageRequestSeq = 0;
        let currentPage = 1;
        const MOVIES_PER_PAGE = 8;

        function canLoadImage(url) {
            return new Promise((resolve) => {
                if (!url) {
                    resolve(false);
                    return;
                }
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        async function setHeroBannerImage(movie) {
            if (!heroBannerImage || !movie?.id) return;

            const requestSeq = ++heroImageRequestSeq;
            const fallbackHeroImage = window.cinemaMovieImages.generatedPoster(movie, { wide: true });
            const isPlaceholderImage = (url) => {
                const normalized = String(url || '').toLowerCase();
                return normalized.includes('aida-public') || normalized.includes('picsum.photos');
            };

            // Uploaded images only: a wide backdrop suits the banner best, then the trailer image, then the poster.
            const preferredCandidates = [];
            const fallbackCandidates = [];
            [movie.backdropImage, movie.trailerImage, movie.posterImage].filter((url) => window.cinemaMovieImages.usableImage(url)).forEach((imageUrl) => {
                (isPlaceholderImage(imageUrl) ? fallbackCandidates : preferredCandidates).push(imageUrl);
            });

            const imageCandidates = [...new Set([...preferredCandidates, ...fallbackCandidates])];

            for (const imageUrl of imageCandidates) {
                const available = await canLoadImage(imageUrl);
                if (available) {
                    if (requestSeq !== heroImageRequestSeq) return;
                    heroBannerImage.src = imageUrl;
                    heroBannerImage.alt = movie.titleThai || movie.titleEng || 'Hero Movie';
                    return;
                }
            }

            if (requestSeq !== heroImageRequestSeq) return;
            heroBannerImage.src = fallbackHeroImage;
            heroBannerImage.alt = movie.titleThai || movie.titleEng || 'Hero Movie';
        }

        function getMainGenre(movie) {
            return movie?.normalizedGenres?.[0] || movie?.genres?.[0] || '-';
        }

        function renderHeroIndicators() {
            if (!heroIndicators) return;
            heroIndicators.innerHTML = featuredMovies.map((_, index) => `
                <button class="hero-indicator w-2.5 h-2.5 rounded-full transition-colors ${index === activeHeroIndex ? 'bg-white' : 'bg-white/40 hover:bg-white'}" data-index="${index}" type="button"></button>
            `).join('');

            heroIndicators.querySelectorAll('.hero-indicator').forEach((indicator) => {
                indicator.addEventListener('click', () => {
                    const nextIndex = Number(indicator.getAttribute('data-index'));
                    if (Number.isNaN(nextIndex)) return;
                    updateHeroBanner(nextIndex);
                    startHeroAutoplay();
                });
            });
        }

        function updateHeroBanner(index) {
            if (!featuredMovies.length) return;
            activeHeroIndex = (index + featuredMovies.length) % featuredMovies.length;
            const movie = featuredMovies[activeHeroIndex];
            if (!movie) return;

            setHeroBannerImage(movie);
            if (heroFormatBadge) {
                heroFormatBadge.textContent = movie.showtimes?.[0]?.systems?.[0]?.format || '2D';
            }
            if (heroBannerTitle) {
                heroBannerTitle.textContent = `${movie.titleThai} (${movie.titleEng})`;
            }
            if (heroBannerDuration) {
                heroBannerDuration.innerHTML = `<span class="material-symbols-outlined text-lg">schedule</span> ${movie.duration || '-'}`;
            }
            if (heroBannerGenre) {
                heroBannerGenre.textContent = getMainGenre(movie);
            }
            if (heroBannerAge) {
                heroBannerAge.textContent = movie.ageLimit || 'G';
            }
            if (heroBannerDescription) {
                heroBannerDescription.textContent = movie.description || '';
            }

            renderHeroIndicators();
        }

        function startHeroAutoplay() {
            if (heroTimer) {
                clearInterval(heroTimer);
            }
            if (featuredMovies.length <= 1) return;
            heroTimer = setInterval(() => {
                updateHeroBanner(activeHeroIndex + 1);
            }, 5000);
        }

        function bindMovieCardEvents() {
            document.querySelectorAll('.movie-card').forEach((card) => {
                const movieId = card.getAttribute('data-movie-id');

                card.addEventListener('click', () => {
                    window.location.href = `movie-details.html?id=${movieId}`;
                });

                const buyBtn = card.querySelector('.buy-ticket-btn');
                if (buyBtn) {
                    buyBtn.addEventListener('click', (event) => {
                        event.stopPropagation();
                        window.location.href = `movie-details.html?id=${encodeURIComponent(movieId)}#showtimes-container`;
                    });
                }
            });
        }

        function renderPagination(totalPages) {
            if (!moviePagination) return;
            if (totalPages <= 1) {
                moviePagination.innerHTML = '';
                return;
            }

            const pageButtons = Array.from({ length: totalPages }, (_value, index) => {
                const pageNumber = index + 1;
                const activeClass = pageNumber === currentPage
                    ? 'bg-slate-900 text-white'
                    : 'bg-background-light text-slate-700 hover:bg-slate-200';
                return `<button class="page-btn px-3 py-2 rounded-lg text-sm font-bold transition ${activeClass}" data-page="${pageNumber}" type="button">${pageNumber}</button>`;
            }).join('');

            moviePagination.innerHTML = `
                <div class="flex items-center justify-center gap-2 w-full flex-wrap">
                    <button class="prev-btn px-4 py-2 rounded-lg text-sm font-bold transition ${currentPage <= 1 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-background-light text-slate-700 hover:bg-slate-200'}" type="button" ${currentPage <= 1 ? 'disabled' : ''}>ก่อนหน้า</button>
                    <div class="hidden sm:flex items-center gap-2">${pageButtons}</div>
                    <span class="sm:hidden text-sm font-semibold text-slate-600">หน้า ${currentPage} / ${totalPages}</span>
                    <button class="next-btn px-4 py-2 rounded-lg text-sm font-bold transition ${currentPage >= totalPages ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-background-light text-slate-700 hover:bg-slate-200'}" type="button" ${currentPage >= totalPages ? 'disabled' : ''}>ถัดไป</button>
                </div>
            `;

            const prevBtn = moviePagination.querySelector('.prev-btn');
            const nextBtn = moviePagination.querySelector('.next-btn');

            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (currentPage <= 1) return;
                    renderMovieGrid(activeGenre, activeSearchQuery, currentPage - 1);
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (currentPage >= totalPages) return;
                    renderMovieGrid(activeGenre, activeSearchQuery, currentPage + 1);
                });
            }

            moviePagination.querySelectorAll('.page-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const targetPage = Number(btn.getAttribute('data-page'));
                    if (Number.isNaN(targetPage)) return;
                    renderMovieGrid(activeGenre, activeSearchQuery, targetPage);
                });
            });
        }

        function renderMovieGrid(selectedGenre = activeGenre, query = activeSearchQuery, targetPage = currentPage) {
            activeGenre = selectedGenre;
            activeSearchQuery = String(query || '').trim().toLowerCase();

            const byGenre = selectedGenre === 'all'
                ? allMovies
                : allMovies.filter((movie) => movie.normalizedGenres.includes(selectedGenre));

            const moviesToShow = activeSearchQuery
                ? byGenre.filter((movie) => {
                    const cinemaNames = (movie.showtimes || []).map((cinema) => cinema.cinema).join(' ');
                    const searchableText = [
                        movie.titleThai,
                        movie.titleEng,
                        ...(movie.normalizedGenres || []),
                        ...(movie.genres || []),
                        cinemaNames
                    ].join(' ').toLowerCase();
                    return searchableText.includes(activeSearchQuery);
                })
                : byGenre;

            const totalPages = Math.max(1, Math.ceil(moviesToShow.length / MOVIES_PER_PAGE));
            currentPage = Math.min(Math.max(Number(targetPage) || 1, 1), totalPages);
            const startIndex = (currentPage - 1) * MOVIES_PER_PAGE;
            const pagedMovies = moviesToShow.slice(startIndex, startIndex + MOVIES_PER_PAGE);

            if (!moviesToShow.length) {
                movieGrid.innerHTML = `
                    <div class="col-span-full bg-white border border-slate-200 rounded-xl p-8 text-center text-slate-500">
                        ไม่พบผลลัพธ์สำหรับ "${query}"
                    </div>
                `;
                renderPagination(0);
                return;
            }

            movieGrid.innerHTML = pagedMovies.map((movie) => `
                <div class="group flex flex-col gap-3 movie-card cursor-pointer" data-movie-id="${movie.id}">
                    <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-slate-200 shadow-sm transition-transform duration-300 group-hover:-translate-y-1">
                        <img alt="${movie.titleThai}" class="w-full h-full object-cover" data-movie-id="${movie.id}" src="${getPoster(movie)}" onerror="this.onerror=null;this.src=window.cinemaMovieImages.generatedPoster(moviesDatabase[this.dataset.movieId] || {});" />
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md text-white text-xs font-bold px-2 py-1 rounded">${movie.showtimes?.[0]?.systems?.[0]?.format || '2D'}</div>
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <button class="buy-ticket-btn bg-primary text-white px-6 py-2 rounded-full font-bold shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">ซื้อตั๋ว</button>
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 text-lg truncate group-hover:text-primary transition-colors">${movie.titleThai}</h3>
                        <div class="flex items-center justify-between mt-1 text-sm text-slate-500">
                            <span>${movie.duration}</span>
                            <span class="border border-slate-300 text-xs px-1 rounded">${movie.ageLimit || 'G'}</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1 truncate">${movie.normalizedGenres.join(' • ')}</p>
                        <div class="mt-2 flex items-center gap-1 text-yellow-500 text-sm font-medium">
                            <span class="material-symbols-outlined text-base fill-current">star</span>
                            <span>${movie.rating}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            bindMovieCardEvents();
            hydrateMoviePosters();
            renderPagination(totalPages);
        }

        const heroBookBtn = document.getElementById('hero-book-btn');
        const heroTrailerBtn = document.getElementById('hero-trailer-btn');
        if (heroBookBtn) {
            heroBookBtn.addEventListener('click', () => {
                const currentMovie = featuredMovies[activeHeroIndex];
                if (!currentMovie) return;
                window.location.href = `movie-details.html?id=${encodeURIComponent(currentMovie.id)}`;
            });
        }

        if (heroTrailerBtn) {
            heroTrailerBtn.addEventListener('click', () => {
                const currentMovie = featuredMovies[activeHeroIndex];
                if (!currentMovie) return;
                window.location.href = `movie-details.html?id=${encodeURIComponent(currentMovie.id)}`;
            });
        }

        if (searchInput) {
            searchInput.addEventListener('input', (event) => {
                renderMovieGrid(activeGenre, event.target.value, 1);
            });
        }

        filterBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
                const selectedGenre = btn.getAttribute('data-genre');
                filterBtns.forEach((b) => {
                    b.classList.remove('bg-slate-900', 'text-white');
                    b.classList.add('bg-background-light', 'text-slate-600');
                });
                btn.classList.remove('bg-background-light', 'text-slate-600');
                btn.classList.add('bg-slate-900', 'text-white');
                renderMovieGrid(selectedGenre, searchInput?.value || '', 1);
            });
        });

        function renderComingSoon() {
            const section = document.getElementById('coming-soon');
            const list = document.getElementById('coming-soon-list');
            const releaseTime = (movie) => Date.parse(movie.releaseDate || '') || Number.MAX_SAFE_INTEGER;
            const movies = Object.values(moviesDatabase).filter(isComingSoon).sort((a, b) => releaseTime(a) - releaseTime(b));
            section.classList.toggle('hidden', movies.length === 0);
            const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            list.innerHTML = movies.map((movie, index) => {
                const time = Date.parse(movie.releaseDate || '');
                const dateLabel = Number.isNaN(time) ? 'เร็ว ๆ นี้' : new Date(time).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                const poster = window.cinemaMovieImages.posterFor(movie);
                return `<a class="min-w-[160px] md:min-w-[200px] max-w-[200px] snap-start group" href="movie-details.html?id=${encodeURIComponent(movie.id)}">
                    <div class="relative aspect-[2/3] rounded-xl overflow-hidden bg-slate-200 mb-3 shadow-md">
                        <img alt="โปสเตอร์ ${esc(movie.titleThai || movie.titleEng)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="${esc(poster)}" loading="lazy"/>
                        ${movie.ageLimit ? `<span class="absolute top-2 right-2 rounded-md bg-black/70 px-2 py-0.5 text-xs font-bold text-white">${esc(movie.ageLimit)}</span>` : ''}
                        <div class="absolute bottom-0 left-0 right-0 ${index === 0 ? 'bg-primary' : 'bg-slate-800'} text-white text-center text-sm font-bold py-2">เข้าฉาย ${esc(dateLabel)}</div>
                    </div>
                    <h4 class="font-bold text-slate-900 line-clamp-1 group-hover:text-primary">${esc(movie.titleThai || movie.titleEng)}</h4>
                    <p class="text-xs text-slate-500 mt-1 line-clamp-1">${esc((movie.genres || []).slice(0, 2).map(normalizeGenreLabel).join(' / '))}</p>
                </a>`;
            }).join('');
        }

        updateHeroBanner(0);
        startHeroAutoplay();
        renderMovieGrid('all', '', 1);
        renderComingSoon();
        document.body.classList.remove('is-loading');
        // footer link "โปรแกรมหน้า" → the section only appears after the catalog loads
        if (window.location.hash === '#coming-soon') document.getElementById('coming-soon').scrollIntoView();
    })();
</script>
