<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>โปรโมชั่น - Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="cinema-api.js"></script>
<script src="site-ui.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#e9508c', 'background-light': '#f8f6f7' } } } };
  </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet"/>
<link href="site.css" rel="stylesheet"/>
</head>
<body class="bg-background-light text-slate-900 min-h-screen flex flex-col font-[Inter]">
<header id="site-header"></header>
<script>cinemaUi.header({"active": "promotions", "search": {"id": "page-search-input", "placeholder": "ค้นหาโปรโมชั่น"}});</script>

  <main class="flex-grow max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8">
      <div>
        <h1 class="ui-title mb-1">โปรโมชั่น</h1>
        <p class="text-slate-600">โปรโมชันส่วนลดตั๋ว หนัง และของว่าง</p>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4" id="promotion-list">
      <div class="rounded-xl border border-slate-200 bg-white p-5 promotion-item">
        <p class="font-bold">Buy 1 Get 1 Free</p>
        <p class="text-sm text-slate-500 mt-1">ใช้ได้ทุกวันพุธ สำหรับสมาชิก</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5 promotion-item">
        <p class="font-bold">ลด 20% ชุดป๊อปคอร์น</p>
        <p class="text-sm text-slate-500 mt-1">เมื่อซื้อตั๋วผ่านแอป</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5 promotion-item">
        <p class="font-bold">เครดิตการ์ดพาร์ทเนอร์</p>
        <p class="text-sm text-slate-500 mt-1">ลดสูงสุด 50% ตามเงื่อนไขธนาคาร</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5 promotion-item">
        <p class="font-bold">คะแนนสมาชิกแลกส่วนลด</p>
        <p class="text-sm text-slate-500 mt-1">80 คะแนน แลกส่วนลด 100 บาท</p>
      </div>
    </div>
  </main>

<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>

  <script>
    (async () => {
      const api = window.cinemaApi;
      const esc = api.escapeHtml;
      const searchInput = document.getElementById('page-search-input');
      const list = document.getElementById('promotion-list');
      const memberPoints = document.getElementById('member-points');
      const DAY_NAMES = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

      // Promo codes managed in the admin page.
      try {
        const promos = await api.request('/api/promotions', { auth: false });
        if (list && promos.length) {
          list.insertAdjacentHTML('afterbegin', promos.map((promo) => {
            const discount = promo.discountType === 'percent' ? `ลด ${promo.discountValue}%` : `ลด ${Number(promo.discountValue).toLocaleString('th-TH')} บาท`;
            const days = promo.daysOfWeek?.length ? `ใช้ได้วัน${promo.daysOfWeek.map((d) => DAY_NAMES[d]).join(', ')}` : 'ใช้ได้ทุกวัน';
            const until = promo.endDate ? ` • ถึง ${api.formatThaiDate(promo.endDate, { day: 'numeric', month: 'short', year: 'numeric' })}` : '';
            return `<div class="rounded-xl border-2 border-primary/30 bg-white p-5 promotion-item">
              <div class="flex items-center justify-between gap-3">
                <h3 class="font-bold text-slate-900">${esc(discount)}</h3>
                <span class="font-mono font-bold text-primary bg-primary/10 px-3 py-1 rounded-lg">${esc(promo.code)}</span>
              </div>
              <p class="text-sm text-slate-600 mt-2">${esc(promo.description || '')}</p>
              <p class="text-xs text-slate-500 mt-2">${esc(days + until)} • กรอกโค้ดในหน้าชำระเงิน</p>
            </div>`;
          }).join(''));
        }
      } catch (_error) {
      }

      api.onAuthChange(async (user) => {
        if (!memberPoints || !user) return;
        try {
          const profile = await api.request('/api/me');
          memberPoints.textContent = `${Number(profile.loyaltyPoints || 0).toLocaleString('th-TH')} คะแนน`;
        } catch (_error) {
          memberPoints.textContent = '0 คะแนน';
        }
      });

      if (!searchInput) return;
      searchInput.addEventListener('input', () => {
        const keyword = searchInput.value.trim().toLowerCase();
        document.querySelectorAll('.promotion-item').forEach((item) => {
          const text = item.textContent.toLowerCase();
          item.style.display = keyword === '' || text.includes(keyword) ? '' : 'none';
        });
      });
    })();
  </script>



  <script type="module">
    import { app, firebaseConfig } from './firebase-init.js';
    import { initializeAuthUI } from './auth.js';

    initializeAuthUI(app, firebaseConfig);
</script>
</body>
</html>
