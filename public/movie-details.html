                "display": ["Inter", "Noto Sans Thai", "sans-serif"],

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet"/>

</head>
<body class="bg-background-light text-slate-900 min-h-screen flex flex-col font-display antialiased">
    <!-- Navbar -->
<header id="site-header"></header>
<script>cinemaUi.header({"active": "movies"});</script>

    <main class="flex-grow">
        <!-- Hero Section -->
        <div class="relative bg-gray-900 text-white overflow-hidden">
            <div class="absolute inset-0 z-0">
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/80 to-transparent z-10"></div>
                <div id="hero-backdrop" class="w-full h-full bg-cover bg-center opacity-60" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASMj5eZTFJZJs9CywraW3SS7EjRRxBBEHqp-Y19NWauJrymZaNn1rXaEBcJQPTmnFDhF7-p6IIwNd7AQa6xtFWoImsrofyxVANdSPqev0LFMGsYGtKLktvAmYxrQAh7SAmvSUcuhxed8VZqLbtnuVBw9ocFdQcmk0jMeZlAJDbIk3YjSTlLfLNvQWmrF_OisbgJslncTjKUzc3oTfExAOGztOdWazgvwZYKGiLfTAsGiHOAPFMZ5QUHFa2B0sMATf-sQCA8zzcKptY');"></div>
            </div>
            <div class="relative z-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-20 lg:pt-14 lg:pb-24">
                <div class="flex flex-col sm:flex-row gap-6 lg:gap-12 sm:items-end">
                    <div class="w-40 sm:w-52 lg:w-64 flex-shrink-0">
                        <div class="relative aspect-[2/3] rounded-2xl overflow-hidden shadow-2xl group border border-white/10">
                            <div id="hero-trailer-bg" class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDyWgC4UyWziyzpvGycmmrFcXTSS5aq4jSUnwBdTIjLplvd3mUe3Fi0fnEEH7FPiW53M7IPURk4T5B1Pz8y3Hrb-HzQnIXXjPPPDH0O_OiPjIi3-MLddIU-KFHdQmUeEyCTXERSUlNmk4G6Uv2eTjvPsb7d3ZgRl7jLNRnrrFGmrQjG4jvJr__cPyk3j5Dut52D5Yv91-IfGUpUVqrnnIhRFOmgkDIXQ1S3W_pkp1pc9w4Owzx2TKuyW7XynLBNtx60tLXTLOS1t-zV');"></div>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-end">
                        <div id="hero-genres" class="flex flex-wrap gap-2 mb-4"></div>
                        <h1 id="hero-title" class="text-3xl md:text-5xl font-extrabold mb-3 leading-tight tracking-tight"></h1>
                        <div class="flex flex-wrap items-center gap-x-6 gap-y-2 mb-5">

                                <span class="material-symbols-outlined fill-current">star</span>
                                <span id="hero-rating" class="text-xl font-bold text-white">4.8</span>
                                <span id="hero-reviews" class="text-sm text-gray-400 ml-1">(12.5k Reviews)</span>

                            <button class="ui-btn !h-12 bg-white/10 hover:bg-white/20 text-white backdrop-blur-sm border-white/15" id="watchlist-hero-btn">
                                <span class="material-symbols-outlined">add</span>
                                อยากดู

                    </div>
                </div>
            </div>
        </div>

        <!-- Booking Section -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-10 relative z-30 mb-16" id="booking-section" style="scroll-margin-top:90px">
            <div class="ui-card overflow-hidden">
                <div class="border-b p-5 sm:p-6" style="border-color:var(--line)">
                    <div class="flex items-end justify-between gap-3 mb-4">
                        <div><p class="ui-eyebrow">ขั้นตอนที่ 1</p><h3 class="text-xl sm:text-2xl font-extrabold tracking-tight">เลือกวันและรอบฉาย</h3></div>
                        <p class="text-sm hidden sm:block" style="color:var(--muted)">กดเวลาเพื่อไปเลือกที่นั่ง</p>
                    </div>
                    <div id="date-tabs" class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1" role="tablist" aria-label="เลือกวันที่"></div>
                </div>
                <div id="showtimes-container" class="p-5 sm:p-6 space-y-4">
                    <!-- Showtimes will be populated here -->
                </div>
            </div>
        </div>

        <!-- Cast Section -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-20" id="cast-section">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-1.5 h-7 bg-primary rounded-full block"></span>
                นักแสดง
            </h2>
            <div id="cast-container" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-6">
                <!-- Cast members will be populated here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>

    <script>
        (async () => {
            const WATCHLIST_KEY = 'cinema.watchlistByUid';

            // Get movie ID from URL parameter
            await window.cinemaApi.catalog();
            const params = new URLSearchParams(window.location.search);
            const movieId = params.get('id') || Object.keys(moviesDatabase)[0];
            const movie = moviesDatabase[movieId];

            if (!movie) {
                alert('Movie not found!');
                window.location.href = 'index.html';
                return;
            }

            // Update page title
            document.getElementById('page-title').textContent = `${movie.titleThai} - Cinema`;

            // Update hero section
            const realPoster = window.cinemaMovieImages?.getRealMoviePoster
                ? await window.cinemaMovieImages.getRealMoviePoster(movie)
                : null;
            const heroBackdrop = realPoster || movie.backdropImage;
            const heroTrailer = realPoster || movie.trailerImage || movie.backdropImage;
            document.getElementById('hero-backdrop').style.backgroundImage = `url('${heroBackdrop}')`;
            document.getElementById('hero-trailer-bg').style.backgroundImage = `url('${heroTrailer}')`;

            // Update genres
            const genresContainer = document.getElementById('hero-genres');
            genresContainer.innerHTML = (movie.genres || []).map(genre => 
                `<span class="px-3 py-1 rounded-full border border-white/20 text-xs font-medium text-white/80">${genre}</span>`
            ).join('');
            genresContainer.innerHTML += `<span class="px-3 py-1 rounded-full bg-white/10 text-xs font-medium text-white/80">${movie.duration}</span>`;
            if (movie.ageLimit) genresContainer.innerHTML += `<span class="px-3 py-1 rounded-full bg-white text-xs font-bold text-slate-900">${movie.ageLimit}</span>`;

            // Update title
            const esc = window.cinemaApi.escapeHtml;
            document.getElementById('hero-title').innerHTML = `${esc(movie.titleThai)} <span class="block text-2xl md:text-3xl font-normal text-gray-300 mt-1">${esc(movie.titleEng || '')}</span>`;

            // Update rating and reviews
            document.getElementById('hero-rating').textContent = movie.rating || '-';
            document.getElementById('hero-reviews').textContent = movie.reviews ? `(${movie.reviews} รีวิว)` : '';
            document.getElementById('hero-rating-box').classList.toggle('hidden', !movie.rating);
            document.getElementById('hero-rating-divider').classList.toggle('hidden', !movie.rating);
            const releaseMs = Date.parse(movie.releaseDate || '');
            const releaseText = Number.isNaN(releaseMs)
                ? (movie.releaseDate || '')
                : new Date(releaseMs).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('hero-release').textContent = releaseText ? `เข้าฉาย ${releaseText}` : '';

            // "โปรแกรมหน้า": no tickets yet → show the release date instead of the buy button
            const comingSoon = movie.status === 'coming_soon' && !(movie.showtimes || []).length;
            if (comingSoon) {
                const buyBtn = document.getElementById('buy-ticket-hero-btn');
                buyBtn.disabled = true;
                buyBtn.classList.add('opacity-90', 'cursor-default');
                buyBtn.innerHTML = `<span class="material-symbols-outlined">event_upcoming</span>${releaseText ? `เข้าฉาย ${esc(releaseText)}` : 'เข้าฉายเร็ว ๆ นี้'}`;
                document.querySelector('#booking-section .ui-eyebrow').textContent = 'โปรแกรมหน้า';
                document.querySelector('#booking-section h3').textContent = 'ยังไม่เปิดขายตั๋ว';
                document.querySelector('#booking-section h3').parentElement.nextElementSibling?.remove();
            }
            document.getElementById('hero-description').textContent = movie.description;

            // Update showtimes (grouped by date → cinema → format)
            const showtimesContainer = document.getElementById('showtimes-container');
            const dateTabs = document.getElementById('date-tabs');
            const allDates = [...new Set((movie.showtimes || []).flatMap((cinema) =>
                cinema.systems.flatMap((system) => system.times.map((slot) => slot.date))))].filter(Boolean).sort();
            const requestedDate = params.get('date');
            let selectedDate = allDates.includes(requestedDate) ? requestedDate : allDates[0];

            function renderDateTabs() {
                if (!allDates.length) {
                    dateTabs.innerHTML = '';
                    return;
                }
                const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
                dateTabs.innerHTML = allDates.map((date) => {
                    const active = date === selectedDate;
                    const fmt = (opts) => window.cinemaApi.formatThaiDate(date, opts);
                    return `<button type="button" role="tab" aria-selected="${active}" data-date="${date}" class="date-tab day-card ${active ? 'active' : ''}">
                        <small>${date === today ? 'วันนี้' : fmt({ weekday: 'short' })}</small><b>${Number(date.slice(8, 10))}</b><span>${fmt({ month: 'short' })}</span></button>`;
                }).join('');
                dateTabs.querySelectorAll('.date-tab').forEach((tab) => {
                    tab.addEventListener('click', () => {
                        selectedDate = tab.dataset.date;
                        renderDateTabs();
                        renderShowtimes();
                    });
                });
            }

            function renderShowtimes() {
                const cinemas = (movie.showtimes || []).map((cinema) => ({
                    ...cinema,
                    systems: cinema.systems
                        .map((system) => ({ ...system, times: system.times.filter((slot) => slot.date === selectedDate) }))
                        .filter((system) => system.times.length)
                })).filter((cinema) => cinema.systems.length);

                if (!cinemas.length) {
                    showtimesContainer.innerHTML = movie.status === 'coming_soon'
                        ? `<div class="text-center text-slate-500 py-12">
                            <span class="material-symbols-outlined text-4xl block mb-2" style="color:var(--primary)">event_upcoming</span>
                            <p class="font-bold text-slate-800">${releaseText ? `เข้าฉาย ${esc(releaseText)}` : 'เข้าฉายเร็ว ๆ นี้'}</p>
                            <p class="text-sm mt-1">รอบฉายจะเปิดให้จองเร็ว ๆ นี้ กด "อยากดู" เพื่อเก็บเรื่องนี้ไว้ในบัญชีของคุณ</p></div>`
                        : `<div class="text-center text-slate-500 py-16">
                            <span class="material-symbols-outlined text-4xl block mb-2">event_busy</span>ยังไม่มีรอบฉายที่เปิดจองในขณะนี้</div>`;
                    return;
                }

                showtimesContainer.innerHTML = cinemas.map(cinema => `
                <div class="cinema-block flex flex-col md:flex-row gap-5">
                    <div class="w-full md:w-1/4">
                        <h3 class="text-lg font-bold text-slate-900 mb-1 flex items-center gap-2"><span class="material-symbols-outlined text-primary">location_on</span>${esc(cinema.cinema)}</h3>
                        ${cinema.distance ? `<p class="text-sm text-slate-500 mb-3 flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">near_me</span> ${esc(cinema.distance)}
                        </p>` : ''}
                        <div class="flex gap-2 flex-wrap">
                            ${(cinema.amenities || []).map(amenity => `<span class="text-[10px] font-bold px-2 py-1 bg-gray-100 text-slate-600 rounded uppercase tracking-wider">${esc(amenity)}</span>`).join('')}
                        </div>
                    </div>
                    <div class="w-full md:w-3/4 space-y-6">
                        ${cinema.systems.map(system => `
                            <div>
                                <div class="flex items-center gap-3 mb-3">
                                    <div class="h-6 px-3 ${system.format === 'IMAX' ? 'w-12 bg-black' : 'bg-gray-200'} rounded flex items-center justify-center ${system.format === 'VIP Class' ? 'border border-yellow-200 bg-yellow-100' : ''}">
                                        <span class="${system.format === 'IMAX' ? 'text-blue-400 font-black italic text-xs tracking-widest' : 'text-slate-600 font-bold text-xs'}">${esc(system.format)}</span>
                                    </div>
                                    <span class="text-sm font-medium text-slate-700">${esc(system.type)}</span>
                                </div>
                                <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2.5">
                                    ${system.times.map(showtime => `
                                        <button class="time-pill showtime-btn" data-showtime-id="${esc(showtime.showtimeId)}" aria-label="รอบ ${esc(showtime.time)} ${esc(showtime.hall)}">
                                            <b>${esc(showtime.time)}</b><span>${esc(showtime.hall)}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

                showtimesContainer.querySelectorAll('.showtime-btn').forEach(btn => {
                    btn.addEventListener('click', () => goToSeatSelection(btn.dataset.showtimeId));
                });
            }

            function goToSeatSelection(showtimeId) {
                if (!showtimeId) return;
                window.authModule.requireLogin(() => {
                    window.location.href = `seat-selection.html?showtimeId=${encodeURIComponent(showtimeId)}`;
                });
            }

            renderDateTabs();
            renderShowtimes();

            // Update cast
            const castContainer = document.getElementById('cast-container');

            const castImageFallbackByName = {
                'Brie Larson': 'https://upload.wikimedia.org/wikipedia/commons/4/40/Captain_Marvel_trailer_at_the_National_Air_and_Space_Museum_4_%28cropped%29.jpg',
                'Teyonah Parris': 'https://upload.wikimedia.org/wikipedia/commons/3/3a/Teyonah_Parris_%2848468994196%29_%28ht%29.jpg',
                'Iman Vellani': 'https://upload.wikimedia.org/wikipedia/commons/6/6e/Iman_Vellani_2022_%282%29.png',
                'Samuel L. Jackson': 'https://upload.wikimedia.org/wikipedia/commons/2/29/SamuelLJackson.jpg',
                'Jennifer Lawrence': 'https://upload.wikimedia.org/wikipedia/commons/0/01/Jennifer_Lawrence%2C_Cannes_Film_Festival_2025.jpg',
                'Josh Hutcherson': 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Josh_Hutcherson_by_Gage_Skidmore_2.jpg',
                'Liam Hemsworth': 'https://upload.wikimedia.org/wikipedia/commons/a/a4/Liam_Hemsworth_June_2016.jpg',
                'Woody Harrelson': 'https://upload.wikimedia.org/wikipedia/commons/3/3a/Woody_Harrelson_191020-N-NU281-1028_%28cropped%29.jpg',
                'Leonardo DiCaprio': 'https://upload.wikimedia.org/wikipedia/commons/2/2d/LeoPTABFI191125-28_%28cropped%29.jpg',
                'Robert De Niro': 'https://upload.wikimedia.org/wikipedia/commons/c/c1/Robert_de_Niro_Cannes_Film_Festival_%283x4_cropped%29.jpg',
                'Lily Gladstone': 'https://upload.wikimedia.org/wikipedia/commons/f/f9/Lily_Gladstone_at_the_2024_Cannes_Film_Festival_%28cropped%29.jpg',
                'Justin Timberlake': 'https://upload.wikimedia.org/wikipedia/commons/e/ed/Justin_Timberlake_by_Gage_Skidmore_2.jpg',
                'Anna Kendrick': 'https://upload.wikimedia.org/wikipedia/commons/1/13/Anna_Kendrick_Cannes_2016_2.jpg',
                'Zooey Deschanel': 'https://upload.wikimedia.org/wikipedia/commons/0/00/Zooey_Deschanel_-_Song_Sung_Blue.jpg',
                'Nadech Kugimiya': 'https://upload.wikimedia.org/wikipedia/commons/1/13/NadechKugimiya2014.jpg',
                'Denise Jelilcha': 'https://upload.wikimedia.org/wikipedia/commons/3/30/Denise072024.jpg',
                'Rattanawadee': 'https://upload.wikimedia.org/wikipedia/commons/0/05/Rattanawadee_2024-11-27.png'
            };

            function getCastImage(actor) {
                const byName = castImageFallbackByName[String(actor?.name || '').trim()];
                return byName || actor.image || 'https://picsum.photos/seed/cast-fallback/200/200';
            }

            function readWatchlistMap() {
                try {
                    const raw = localStorage.getItem(WATCHLIST_KEY);
                    const parsed = raw ? JSON.parse(raw) : {};
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (_error) {
                    return {};
                }
            }

            function writeWatchlistMap(nextMap) {
                localStorage.setItem(WATCHLIST_KEY, JSON.stringify(nextMap));
            }

            function getCurrentUid() {
                return localStorage.getItem('cinema.uid') || '';
            }

            function addMovieToWatchlist(targetMovieId) {
                const uid = getCurrentUid();
                if (!uid) return { ok: false, message: 'กรุณาเข้าสู่ระบบก่อน' };

                const watchlistMap = readWatchlistMap();
                const current = new Set(Array.isArray(watchlistMap[uid]) ? watchlistMap[uid] : []);
                if (current.has(targetMovieId)) {
                    return { ok: true, existed: true };
                }

                current.add(targetMovieId);
                watchlistMap[uid] = Array.from(current);
                writeWatchlistMap(watchlistMap);
                return { ok: true, existed: false };
            }

            function removeMovieFromWatchlist(targetMovieId) {
                const uid = getCurrentUid();
                if (!uid) return { ok: false, message: 'กรุณาเข้าสู่ระบบก่อน' };

                const watchlistMap = readWatchlistMap();
                const current = new Set(Array.isArray(watchlistMap[uid]) ? watchlistMap[uid] : []);
                if (!current.has(targetMovieId)) {
                    return { ok: true, removed: false };
                }

                current.delete(targetMovieId);
                watchlistMap[uid] = Array.from(current);
                writeWatchlistMap(watchlistMap);
                return { ok: true, removed: true };
            }

            function toggleMovieInWatchlist(targetMovieId) {
                const uid = getCurrentUid();
                if (!uid) return { ok: false, message: 'กรุณาเข้าสู่ระบบก่อน' };

                const map = readWatchlistMap();
                const list = Array.isArray(map[uid]) ? map[uid] : [];
                if (list.includes(targetMovieId)) {
                    const removed = removeMovieFromWatchlist(targetMovieId);
                    return { ...removed, action: 'removed' };
                }

                const added = addMovieToWatchlist(targetMovieId);
                return { ...added, action: 'added' };
            }

            function updateWatchlistButtonState() {
                const btn = document.getElementById('watchlist-hero-btn');
                if (!btn) return;
                const uid = getCurrentUid();
                const map = readWatchlistMap();
                const list = uid && Array.isArray(map[uid]) ? map[uid] : [];
                const inWatchlist = list.includes(movieId);
                btn.innerHTML = inWatchlist
                    ? '<span class="material-symbols-outlined">check</span>บันทึกไว้แล้ว'
                    : '<span class="material-symbols-outlined">add</span>อยากดู';
            }

            const filteredCast = (movie.cast || []).filter(actor => String(actor?.name || '').trim() !== 'Junior Kajbhunditt');

            document.getElementById('cast-section').classList.toggle('hidden', filteredCast.length === 0);
            castContainer.innerHTML = filteredCast.map(actor => `
                <div class="flex flex-col items-center text-center">
                    <div class="w-24 h-24 rounded-full bg-gray-200 mb-3 overflow-hidden shadow-md">
                        <div class="w-full h-full bg-cover bg-center" style="background-image: url('${getCastImage(actor)}');"></div>
                    </div>
                    <h4 class="font-bold text-slate-900 text-sm">${esc(actor.name)}</h4>
                    <p class="text-xs text-slate-500">${esc(actor.role)}</p>
                </div>
            `).join('');

            // Buy ticket → jump to the showtime list
            document.getElementById('buy-ticket-hero-btn').addEventListener('click', () => {
                document.getElementById('booking-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            const watchlistBtn = document.getElementById('watchlist-hero-btn');
            if (watchlistBtn) {
                watchlistBtn.addEventListener('click', () => {
                    window.authModule.requireLogin(() => {
                        const result = toggleMovieInWatchlist(movieId);
                        if (!result.ok) {
                            alert(result.message || 'ไม่สามารถอัปเดต Watchlist ได้');
                            return;
                        }
                        updateWatchlistButtonState();
                        if (result.action === 'added' && !result.existed) {
                            alert('เพิ่มลง Watchlist แล้ว');
                        } else if (result.action === 'removed' && result.removed) {
                            alert('ลบออกจาก Watchlist แล้ว');
                        }
                    });
                });
            }

            updateWatchlistButtonState();
        })();
    </script>

    

    <script type="module">
    import { app, firebaseConfig } from './firebase-init.js';
    import { initializeAuthUI } from './auth.js';

    initializeAuthUI(app, firebaseConfig);
</script>
