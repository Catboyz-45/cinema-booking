<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>

  <title>สมาชิก - Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#e9508c', 'background-light': '#f8f6f7' } } } };
  </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<body class="flex flex-col bg-background-light text-slate-900 min-h-screen font-[Inter]">
<header id="site-header"></header>
<script>cinemaUi.header({});</script>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div class="grid md:grid-cols-3 gap-4">
      <div class="rounded-xl border border-slate-200 bg-white p-5">

        <p class="text-sm text-slate-500 mt-1">สะสมแต้มทุกการจอง</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5">

        <p class="text-sm text-slate-500 mt-1">รับส่วนลดพิเศษรายเดือน</p>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-5">
        <p class="font-bold">Platinum</p>
        <p class="text-sm text-slate-500 mt-1">สิทธิ์จองล่วงหน้าและเลานจ์</p>
      </div>
    </div>
  </main>
<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>
