<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>โรงภาพยนตร์ - Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="cinema-api.js"></script>
<script src="site-ui.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#e9508c', 'background-light': '#f8f6f7' } } } };
  </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet"/>
<link href="site.css" rel="stylesheet"/>
</head>
<body class="bg-background-light text-slate-900 min-h-screen flex flex-col font-[Inter]">
<header id="site-header"></header>
<script>cinemaUi.header({"active": "cinemas", "search": {"id": "page-search-input", "placeholder": "ค้นหาโรงภาพยนตร์"}});</script>

  <main class="flex-grow max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8">
      <div>
        <h1 class="ui-title mb-1">โรงภาพยนตร์</h1>
        <p class="text-slate-600">รายชื่อโรงภาพยนตร์และสาขาที่ให้บริการ</p>
      </div>
    </div>

    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-6">
      <button class="region-filter-btn px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-bold whitespace-nowrap" data-region="all">ทั้งหมด</button>
      <button class="region-filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-region="กรุงเทพฯและปริมณฑล">กรุงเทพฯและปริมณฑล</button>
      <button class="region-filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-region="ภาคเหนือ">ภาคเหนือ</button>
      <button class="region-filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-region="ภาคตะวันออกเฉียงเหนือ">ภาคตะวันออกเฉียงเหนือ</button>
      <button class="region-filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-region="ภาคตะวันออก">ภาคตะวันออก</button>
      <button class="region-filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-region="ภาคใต้">ภาคใต้</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="cinema-grid">
    </div>
  </main>

<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>

  <script>
    (() => {
      const searchInput = document.getElementById('page-search-input');
      const cinemaGrid = document.getElementById('cinema-grid');
      const filterButtons = Array.from(document.querySelectorAll('.region-filter-btn'));
      let activeRegion = 'all';
      const locationImageFallback = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Pattaya_beach_from_view_point.jpg/640px-Pattaya_beach_from_view_point.jpg';

      const cinemas = [
        {
          name: 'Paragon Cineplex',
          branch: 'Siam Paragon, Bangkok',
          region: 'กรุงเทพฯและปริมณฑล',
          systems: 'IMAX • 4DX • VIP',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Siam_Paragon_06.23.jpg'
        },
        {
          name: 'Major Cineplex Ratchayothin',
          branch: 'Ratchayothin, Bangkok',
          region: 'กรุงเทพฯและปริมณฑล',
          systems: 'Laser • Kids Cinema',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Major_Cineplex_Ratchayothin_and_traffic.jpg'
        },
        {
          name: 'ICON CINECONIC',
          branch: 'ICONSIAM, Bangkok',
          region: 'กรุงเทพฯและปริมณฑล',
          systems: 'IMAX • Dolby Atmos',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Magnolias_Waterfront_Residences_Iconsiam.jpg'
        },
        {
          name: 'Major Cineplex Central Westgate',
          branch: 'Nonthaburi',
          region: 'กรุงเทพฯและปริมณฑล',
          systems: 'Laser • MX4D',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Central_Westgate_%2855%29.jpg'
        },
        {
          name: 'Major Cineplex Central Chiangmai Airport',
          branch: 'Chiang Mai',
          region: 'ภาคเหนือ',
          systems: 'Laser • Kids Cinema',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Ancient_city_wall_and_Chang_Phueak_Gate_in_Chiang_Mai.jpg'
        },
        {
          name: 'Major Cineplex Central Phitsanulok',
          branch: 'Phitsanulok',
          region: 'ภาคเหนือ',
          systems: 'Digital Cinema',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Route_12_in_Phitsanulok_2.jpg'
        },
        {
          name: 'Major Cineplex Central Korat',
          branch: 'Nakhon Ratchasima',
          region: 'ภาคตะวันออกเฉียงเหนือ',
          systems: 'IMAX • Laser',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/2019_02_Central_Mall_Korat_exterior.jpg'
        },
        {
          name: 'Major Cineplex Central Khon Kaen',
          branch: 'Khon Kaen',
          region: 'ภาคตะวันออกเฉียงเหนือ',
          systems: 'Laser • Dolby Atmos',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Ubosot_Wat_Klang_Khon_Kaen.jpg'
        },
        {
          name: 'Major Cineplex Central Udon',
          branch: 'Udon Thani',
          region: 'ภาคตะวันออกเฉียงเหนือ',
          systems: 'Digital Cinema',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Udon_Thani_-_The_City_Pillar_Shrine_-_0002.jpg'
        },
        {
          name: 'Major Cineplex Central Rayong',
          branch: 'Rayong',
          region: 'ภาคตะวันออก',
          systems: 'Laser • 3D',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Rayong_Museum.jpg'
        },
        {
          name: 'Major Cineplex Harbor Pattaya',
          branch: 'Pattaya, Chonburi',
          region: 'ภาคตะวันออก',
          systems: 'Digital Cinema • Kids Cinema',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Pattaya_beach_from_view_point.jpg'
        },
        {
          name: 'Major Cineplex Central Phuket',
          branch: 'Phuket',
          region: 'ภาคใต้',
          systems: 'IMAX • Laser',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Central_Phuket_shopping_mall.jpg'
        },
        {
          name: 'Major Cineplex Central Hatyai',
          branch: 'Hat Yai, Songkhla',
          region: 'ภาคใต้',
          systems: 'Digital Cinema • Dolby Atmos',
          image: 'https://commons.wikimedia.org/wiki/Special:FilePath/View_of_Hat_Yai_City_%28I%29.jpg'
        }
      ];

      function renderCinemas() {
        const keyword = (searchInput?.value || '').trim().toLowerCase();
        const filtered = cinemas.filter((cinema) => {
          const passRegion = activeRegion === 'all' || cinema.region === activeRegion;
          const bag = `${cinema.name} ${cinema.branch} ${cinema.region} ${cinema.systems}`.toLowerCase();
          const passKeyword = !keyword || bag.includes(keyword);
          return passRegion && passKeyword;
        });

        if (!filtered.length) {
          cinemaGrid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">ไม่พบสาขาที่ตรงกับการค้นหา</div>';
          return;
        }

        cinemaGrid.innerHTML = filtered.map((cinema) => `
          <div class="group flex flex-col gap-3 rounded-xl">
            <div class="relative aspect-[4/3] rounded-xl overflow-hidden bg-slate-200 shadow-sm transition-transform duration-300 group-hover:-translate-y-1">
              <img alt="${cinema.name}" class="w-full h-full object-cover" src="${cinema.image || locationImageFallback}" onerror="this.onerror=null;this.src='${locationImageFallback}';" />
              <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/65 to-transparent p-3">
                <span class="inline-flex bg-primary/90 text-white text-[11px] font-semibold px-2 py-1 rounded">${cinema.region}</span>
              </div>
            </div>
            <div>
              <h3 class="font-bold text-slate-900 text-base leading-tight line-clamp-2 group-hover:text-primary transition-colors">${cinema.name}</h3>
              <p class="text-sm text-slate-500 mt-1">${cinema.branch}</p>
              <p class="text-xs text-slate-500 mt-1">${cinema.systems}</p>
            </div>
          </div>
        `).join('');
      }

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeRegion = button.getAttribute('data-region') || 'all';
          filterButtons.forEach((btn) => {
            btn.classList.remove('bg-slate-900', 'text-white');
            btn.classList.add('bg-background-light', 'text-slate-600');
          });
          button.classList.remove('bg-background-light', 'text-slate-600');
          button.classList.add('bg-slate-900', 'text-white');
          renderCinemas();
        });
      });

      if (searchInput) {
        searchInput.addEventListener('input', renderCinemas);
      }

      renderCinemas();

    })();
  </script>



  <script type="module">
    import { app, firebaseConfig } from './firebase-init.js';
    import { initializeAuthUI } from './auth.js';

    initializeAuthUI(app, firebaseConfig);
</script>
</body>
</html>
