<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>โรงภาพยนตร์ - Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="cinema-api.js"></script>
<script src="site-ui.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#e9508c', 'background-light': '#f8f6f7' } } } };
  </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet"/>
<link href="site.css" rel="stylesheet"/>
</head>
<body class="is-loading bg-background-light text-slate-900 min-h-screen flex flex-col font-[Inter]">
<header id="site-header"></header>
<script>cinemaUi.header({"active": "cinemas", "search": {"id": "page-search-input", "placeholder": "ค้นหาโรงภาพยนตร์"}});</script>

  <main class="flex-grow max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-8">
      <div>
        <h1 class="ui-title mb-1">โรงภาพยนตร์</h1>
        <p class="text-slate-600">รายชื่อโรงภาพยนตร์และสาขาที่ให้บริการ</p>
      </div>
    </div>

    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-6" id="region-filters" role="group" aria-label="กรองตามภูมิภาค">
      <button class="region-filter-btn px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-bold whitespace-nowrap" data-region="all" type="button">ทั้งหมด</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" id="cinema-grid">
      <div class="aspect-[4/3] rounded-xl" data-skel></div><div class="aspect-[4/3] rounded-xl" data-skel></div><div class="aspect-[4/3] rounded-xl hidden md:block" data-skel></div><div class="aspect-[4/3] rounded-xl hidden lg:block" data-skel></div><div class="aspect-[4/3] rounded-xl hidden xl:block" data-skel></div>
    </div>
    <p class="mt-10 text-xs text-slate-400 leading-relaxed" id="photo-note">ภาพสาขาบางส่วนมาจาก <a class="underline" href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> ภายใต้สัญญาอนุญาตที่ระบุใต้แต่ละภาพ (เช่น CC BY-SA) ภาพถูกครอปและย่อขนาดเพื่อแสดงผล กดที่เครดิตเพื่อดูภาพต้นฉบับและรายละเอียดสัญญาอนุญาต</p>
  </main>

<footer id="site-footer"></footer>
<script>cinemaUi.footer();</script>

  <script>
    (async () => {
      // Branches come from the admin (สาขา menu): name, location, region, systems and an uploaded photo.
      const api = window.cinemaApi;
      const esc = api.escapeHtml;
      const searchInput = document.getElementById('page-search-input');
      const cinemaGrid = document.getElementById('cinema-grid');
      const filterBar = document.getElementById('region-filters');
      let activeRegion = 'all';
      let cinemas = [];

      try {
        const data = await api.request('/api/cinemas', { auth: false });
        cinemas = data.cinemas || [];
        const regions = (data.regions || []).filter((region) => cinemas.some((cinema) => cinema.region === region));
        filterBar.insertAdjacentHTML('beforeend', regions.map((region) => `
          <button class="region-filter-btn px-4 py-2 bg-background-light hover:bg-slate-200 text-slate-600 rounded-lg text-sm font-medium whitespace-nowrap transition" data-region="${esc(region)}" type="button">${esc(region)}</button>`).join(''));
      } catch (error) {
        cinemaGrid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">โหลดรายชื่อสาขาไม่สำเร็จ ${esc(error.message || '')}</div>`;
        document.body.classList.remove('is-loading');
        return;
      }

      const photoHtml = (cinema) => cinema.image
        ? `<img alt="${esc(cinema.name)}" class="w-full h-full object-cover" src="${esc(cinema.image)}" loading="lazy" onerror="this.remove()"/>`
        : '';

      function renderCinemas() {
        const keyword = (searchInput?.value || '').trim().toLowerCase();
        const filtered = cinemas.filter((cinema) => {
          const passRegion = activeRegion === 'all' || cinema.region === activeRegion;
          const bag = `${cinema.name} ${cinema.branch} ${cinema.region} ${cinema.systems}`.toLowerCase();
          return passRegion && (!keyword || bag.includes(keyword));
        });

        if (!filtered.length) {
          cinemaGrid.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">ไม่พบสาขาที่ตรงกับการค้นหา</div>';
          return;
        }

        cinemaGrid.innerHTML = filtered.map((cinema) => `
          <div class="group flex flex-col gap-3 rounded-xl">
            <div class="relative aspect-[4/3] rounded-xl overflow-hidden shadow-sm transition-transform duration-300 group-hover:-translate-y-1 bg-gradient-to-br from-primary to-slate-900 grid place-items-center">
              <span class="material-symbols-outlined text-white/50 text-5xl">storefront</span>
              <div class="absolute inset-0">${photoHtml(cinema)}</div>
              ${cinema.region ? `<div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/65 to-transparent p-3">
                <span class="inline-flex bg-primary/90 text-white text-[11px] font-semibold px-2 py-1 rounded">${esc(cinema.region)}</span>
              </div>` : ''}
            </div>
            <div>
              <h3 class="font-bold text-slate-900 text-base leading-tight line-clamp-2 group-hover:text-primary transition-colors">${esc(cinema.name)}</h3>
              ${cinema.branch ? `<p class="text-sm text-slate-500 mt-1">${esc(cinema.branch)}</p>` : ''}
              ${cinema.systems ? `<p class="text-xs text-slate-500 mt-1">${esc(cinema.systems)}</p>` : ''}
              ${cinema.image && cinema.imageCredit ? `<p class="text-[11px] text-slate-400 mt-1.5 leading-snug">ภาพ: ${cinema.imageCreditUrl ? `<a class="hover:underline" href="${esc(cinema.imageCreditUrl)}" target="_blank" rel="noopener">${esc(cinema.imageCredit)}</a>` : esc(cinema.imageCredit)}</p>` : ''}
            </div>
          </div>
        `).join('');
      }

      filterBar.addEventListener('click', (event) => {
        const button = event.target.closest('.region-filter-btn');
        if (!button) return;
        activeRegion = button.getAttribute('data-region') || 'all';
        filterBar.querySelectorAll('.region-filter-btn').forEach((btn) => {
          const on = btn === button;
          btn.classList.toggle('bg-slate-900', on);
          btn.classList.toggle('text-white', on);
          btn.classList.toggle('font-bold', on);
          btn.classList.toggle('bg-background-light', !on);
          btn.classList.toggle('text-slate-600', !on);
        });
        renderCinemas();
      });

      if (searchInput) {
        searchInput.addEventListener('input', renderCinemas);
      }

      renderCinemas();
      document.body.classList.remove('is-loading');
    })();
  </script>



  <script type="module">
    import { app, firebaseConfig } from './firebase-init.js';
    import { initializeAuthUI } from './auth.js';

    initializeAuthUI(app, firebaseConfig);
</script>
</body>
</html>
